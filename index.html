<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Note Learner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Note Learner</title>
<style>
  :root {
    --bg: #f6f3ee; --fg: #1d1b19; --paper: #fffdf8; --ink: #111111;
    --btn: #ebe6dd; --btn-active: #d9d2c4; --seg: #ffffff;
    --ok: #2e9e5b; --bad: #d64545;
  }
  :root[data-theme=dark] {
    --bg: #121110; --fg: #f1ede6; --paper: #1c1a19; --ink: #ffffff;
    --btn: #34312e; --btn-active: #48443f; --seg: #4a4642;
    --ok: #43c47a; --bad: #ef6a6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap: 12px; }
  .top { display: flex; gap: 10px; }
  .modes { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--btn); border-radius: 12px; padding: 4px; }
  .modes button { border: 0; background: transparent; color: var(--fg); font-size: 16px; font-weight: 600;
    padding: 10px 4px; border-radius: 9px; }
  .modes button[aria-pressed=true] { background: var(--seg); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .top { position: relative; }
  #settings-btn { border: 0; background: var(--btn); color: var(--fg); border-radius: 12px; width: 48px;
    display: flex; align-items: center; justify-content: center; padding: 0; }
  #settings-btn:active, #settings-btn[aria-expanded=true] { background: var(--btn-active); }
  #settings-btn svg { width: 22px; height: 22px; }

  /* Small settings window that drops down from the button. */
  .panel { position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; width: min(320px, 100%);
    background: var(--paper); color: var(--fg); border-radius: 16px; padding: 4px 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.25), 0 0 0 1px rgba(128,128,128,.18); }
  .panel[hidden] { display: none; }
  .panel .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; }
  .panel .row + .row { border-top: 1px solid rgba(128,128,128,.25); }
  .panel .label { font-size: 16px; font-weight: 600; }
  .panel .hint { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; opacity: .65; }
  .switch { position: relative; flex: none; width: 52px; height: 32px; border: 0; border-radius: 16px;
    background: var(--btn-active); transition: background .15s; padding: 0; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--fg); transition: transform .15s, background .15s; }
  .switch[aria-checked=true] { background: var(--fg); }
  .switch[aria-checked=true]::after { background: var(--bg); transform: translateX(20px); }

  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: var(--paper); border-radius: 18px; border: 3px solid transparent;
    box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: border-color .12s; padding: 8px; }
  .stage.ok { border-color: var(--ok); }
  .stage.bad { border-color: var(--bad); }
  #score { width: 100%; max-height: 100%; }
  #score svg { display: block; width: 100%; height: auto; max-height: 100%; }

  .keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .keys button { border: 0; border-radius: 14px; background: var(--btn); color: var(--fg);
    font-size: 26px; font-weight: 700; padding: 22px 0; }
  .keys button:active { background: var(--btn-active); }
  @media (max-width: 380px) { .keys button { font-size: 22px; padding: 18px 0; } .keys { gap: 5px; } }
</style>
<script>
  // Apply the saved theme (or the system's) before first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark')
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="modes" role="group" aria-label="Clef">
      <button id="m-treble" aria-pressed="true">Treble</button>
      <button id="m-bass" aria-pressed="false">Bass</button>
      <button id="m-grand" aria-pressed="false">Both</button>
    </div>
    <button id="settings-btn" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>
      </svg>
    </button>
    <div class="panel" id="panel" role="dialog" aria-label="Settings" hidden>
      <div class="row">
        <span class="label" id="dark-label">Dark mode</span>
        <button class="switch" id="dark" role="switch" aria-checked="false" aria-labelledby="dark-label"></button>
      </div>
      <div class="row">
        <span class="label" id="extras-label">Extra high &amp; low notes
          <span class="hint" id="extras-hint"></span></span>
        <button class="switch" id="extras" role="switch" aria-checked="true" aria-labelledby="extras-label"></button>
      </div>
    </div>
  </div>
  <div class="stage" id="stage"><div id="score" aria-label="Staff"></div></div>
  <div class="keys" id="keys"></div>
</div>

<script src="vendor/vexflow.js"></script>
<script>
const { Renderer, Stave, StaveNote, StaveConnector, Voice, Formatter } = Vex.Flow;
const LETTERS = ['C','D','E','F','G','A','B'];

// Diatonic number n = octave*7 + letterIndex (so C4 = 28).
const C4 = 4*7;
// Widest range each mode can show (the "extra high & low notes" switch ON): up to four ledger
// lines above and below the staff. Treble D3..G6, bass F1..B4, both staves together F1..G6.
const CLEFS = {
  treble: { lo: 3*7 + 1,     hi: 6*7 + 4 },
  bass:   { lo: 1*7 + 3,     hi: 4*7 + 6 },
  grand:  { lo: 1*7 + 3,     hi: 6*7 + 4 },
};
// Always allowed, switch on or off: the staff plus up to ONE ledger line above and below it.
const NEAR = {
  treble: { lo: C4,          hi: 5*7 + 5 },   // C4 .. A5
  bass:   { lo: 2*7 + 2,     hi: C4 },        // E2 .. C4
};
// Grand staff: which clef(s) a note may be written on. A3..E4 sit in the gap between the
// staves, where real music writes them on either staff (right hand dipping below middle C,
// left hand reaching above it, each with up to two ledger lines). Everything else has one home.
const TREBLE_MIN = C4 - 2;   // A3
const BASS_MAX   = C4 + 2;   // E4
const clefsFor = n => (n < TREBLE_MIN ? ['bass'] : n > BASS_MAX ? ['treble'] : ['treble', 'bass']);

// "Extra high & low notes" switch: on = the wide ranges above, off = staff + one ledger line.
let extras = true;
try { extras = localStorage.getItem('extras') !== 'off'; } catch (e) {}

// Every clef a note may be written on under the current mode and switch ([] = never quizzed).
function clefsAllowed(n) {
  const near = (c) => n >= NEAR[c].lo && n <= NEAR[c].hi;
  if (mode === 'grand') {
    if (n < CLEFS.grand.lo || n > CLEFS.grand.hi) return [];
    return extras ? clefsFor(n) : ['treble', 'bass'].filter(near);
  }
  const r = extras ? CLEFS[mode] : NEAR[mode];
  return n >= r.lo && n <= r.hi ? [mode] : [];
}

// Single staff: lines sit at y = 50..90, leaving room for four ledger lines (and notes) either side.
const VIEW_W = 142, STAVE_W = 140, STAVE_Y = 10, SINGLE_H = 145;
// Printed piano music leaves a clear gap between the staves (4 staff-spaces here), so a note
// in the middle zone looks different depending on which staff it hangs from.
const GRAND = { x: 18, w: 122, trebleY: 10, bassY: 90, h: 225 };

let mode = 'treble', note = null, locked = false;
try { const m = localStorage.getItem('mode'); if (CLEFS[m]) mode = m; } catch (e) {}

const $ = id => document.getElementById(id);
const stage = $('stage'), score = $('score');
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// Which clef is the note drawn on? In grand mode a note in the middle zone may be on either.
let noteClef = null;
const clefOf = n => {
  if (mode !== 'grand') return mode;
  const ok = clefsAllowed(n);
  if (ok.includes(noteClef)) return noteClef;
  return (ok[0] || clefsFor(n)[0]);
};
const keyFor = n => LETTERS[n % 7].toLowerCase() + '/' + Math.floor(n / 7);

function draw(color) {
  score.replaceChildren();
  const ink = cssVar('--ink');
  const grand = mode === 'grand';
  const h = grand ? GRAND.h : SINGLE_H;

  const renderer = new Renderer(score, Renderer.Backends.SVG);
  renderer.resize(VIEW_W, h);
  const ctx = renderer.getContext();
  ctx.setFillStyle(ink); ctx.setStrokeStyle(ink);
  const style = { fillStyle: ink, strokeStyle: ink };

  let staves, target;
  if (grand) {
    const t = new Stave(GRAND.x, GRAND.trebleY, GRAND.w).addClef('treble');
    const b = new Stave(GRAND.x, GRAND.bassY, GRAND.w).addClef('bass');
    for (const s of [t, b]) { s.setStyle(style); s.setContext(ctx).draw(); }
    const types = StaveConnector.type;
    for (const type of [types.BRACE, types.SINGLE_LEFT, types.SINGLE_RIGHT]) {
      const c = new StaveConnector(t, b).setType(type);
      c.setStyle(style); c.setContext(ctx).draw();
    }
    target = clefOf(note) === 'treble' ? t : b;
  } else {
    target = new Stave(1, STAVE_Y, STAVE_W).addClef(mode);
    target.setStyle(style);
    target.setContext(ctx).draw();
  }

  const c = color || ink;
  const sn = new StaveNote({ keys: [keyFor(note)], duration: 'q', clef: clefOf(note), auto_stem: true });
  sn.setStyle({ fillStyle: c, strokeStyle: c });
  sn.setLedgerLineStyle({ fillStyle: c, strokeStyle: c, lineWidth: 1.5 });

  const voice = new Voice({ num_beats: 1, beat_value: 4 }).addTickables([sn]);
  new Formatter().joinVoices([voice]).format([voice], 0);
  const room = target.getNoteEndX() - target.getNoteStartX();
  sn.setXShift(room / 2 - 18);
  voice.draw(ctx, target);

  const svg = score.querySelector('svg');
  svg.setAttribute('viewBox', `0 0 ${VIEW_W} ${h}`);
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.style.width = '100%'; svg.style.height = 'auto';
}

function nextNote() {
  const all = CLEFS[mode];
  const pool = [];
  for (let n = all.lo; n <= all.hi; n++) if (n !== note && clefsAllowed(n).length) pool.push(n);
  const n = pool[Math.floor(Math.random() * pool.length)];
  note = n;
  if (mode === 'grand') { const ok = clefsAllowed(n); noteClef = ok[Math.floor(Math.random() * ok.length)]; }
  draw();
}

let flashTimer;
function flash(cls) {
  clearTimeout(flashTimer);
  stage.classList.remove('ok', 'bad');
  void stage.offsetWidth;
  stage.classList.add(cls);
  flashTimer = setTimeout(() => stage.classList.remove(cls), 350);
}

function answer(letter) {
  if (locked) return;
  if (LETTERS[note % 7] === letter) {
    locked = true; flash('ok'); draw(cssVar('--ok'));
    setTimeout(() => { nextNote(); locked = false; }, 300);
  } else {
    flash('bad'); draw(cssVar('--bad'));
    const shown = note;
    setTimeout(() => { if (note === shown && !locked) draw(); }, 350);
  }
}

function setMode(m) {
  mode = m;
  try { localStorage.setItem('mode', m); } catch (e) {}
  for (const k of Object.keys(CLEFS)) $('m-' + k).setAttribute('aria-pressed', k === m);
  note = null; locked = false; nextNote();
}

function setExtras(on, save) {
  extras = on;
  $('extras').setAttribute('aria-checked', on);
  $('extras-hint').textContent = on ? 'Up to 4 ledger lines' : 'Staff + 1 ledger line';
  if (save) try { localStorage.setItem('extras', on ? 'on' : 'off'); } catch (e) {}
  if (save) { locked = false; nextNote(); }   // the current note may no longer be allowed
}

function setTheme(t, save) {
  document.documentElement.dataset.theme = t;
  $('dark').setAttribute('aria-checked', t === 'dark');
  document.querySelector('meta[name=theme-color]').setAttribute('content', cssVar('--bg'));
  if (save) try { localStorage.setItem('theme', t); } catch (e) {}
  if (note !== null) draw();
}

for (const l of ['A','B','C','D','E','F','G']) {
  const b = document.createElement('button');
  b.textContent = l;
  b.addEventListener('pointerdown', e => { e.preventDefault(); answer(l); });
  $('keys').append(b);
}
for (const k of Object.keys(CLEFS)) $('m-' + k).onclick = () => setMode(k);
$('dark').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
$('extras').onclick = () => setExtras(!extras, true);

// Settings window: opens from the button, closes on outside tap, Escape, or the button again.
const panel = $('panel'), settingsBtn = $('settings-btn');
function setPanel(open) {
  panel.hidden = !open;
  settingsBtn.setAttribute('aria-expanded', open);
}
settingsBtn.onclick = () => setPanel(panel.hidden);
document.addEventListener('pointerdown', e => {
  if (!panel.hidden && !panel.contains(e.target) && !settingsBtn.contains(e.target)) setPanel(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') setPanel(false); });

setTheme(document.documentElement.dataset.theme, false);
setExtras(extras, false);
setMode(mode);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
