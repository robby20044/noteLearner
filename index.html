<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Note Learner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Note Learner</title>
<style>
  :root {
    --bg: #f6f3ee; --fg: #1d1b19; --paper: #fffdf8; --ink: #111111;
    --btn: #ebe6dd; --btn-active: #d9d2c4; --seg: #ffffff;
    --ok: #2e9e5b; --bad: #d64545;
  }
  :root[data-theme=dark] {
    --bg: #121110; --fg: #f1ede6; --paper: #1c1a19; --ink: #ffffff;
    --btn: #34312e; --btn-active: #48443f; --seg: #4a4642;
    --ok: #43c47a; --bad: #ef6a6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap: 16px; }
  .top { display: flex; gap: 10px; }
  .modes { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--btn); border-radius: 12px; padding: 4px; }
  .modes button { border: 0; background: transparent; color: var(--fg); font-size: 16px; font-weight: 600;
    padding: 10px 4px; border-radius: 9px; }
  .modes button[aria-pressed=true] { background: var(--seg); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  #theme { border: 0; background: var(--btn); color: var(--fg); border-radius: 12px; width: 48px; font-size: 20px; }
  #theme:active { background: var(--btn-active); }

  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    background: var(--paper); border-radius: 18px; border: 3px solid transparent;
    box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: border-color .12s; padding: 8px; }
  .stage.ok { border-color: var(--ok); }
  .stage.bad { border-color: var(--bad); }
  #score { width: 100%; max-height: 100%; }
  #score svg { display: block; width: 100%; height: auto; max-height: 100%; }

  .keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .keys button { border: 0; border-radius: 14px; background: var(--btn); color: var(--fg);
    font-size: 26px; font-weight: 700; padding: 22px 0; }
  .keys button:active { background: var(--btn-active); }
  @media (max-width: 380px) { .keys button { font-size: 22px; padding: 18px 0; } .keys { gap: 5px; } }
</style>
<script>
  // Apply the saved theme (or the system's) before first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark')
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="modes" role="group" aria-label="Clef">
      <button id="m-treble" aria-pressed="true">Treble</button>
      <button id="m-bass" aria-pressed="false">Bass</button>
      <button id="m-grand" aria-pressed="false">Both</button>
    </div>
    <button id="theme" aria-label="Toggle dark mode"></button>
  </div>
  <div class="stage" id="stage"><div id="score" aria-label="Staff"></div></div>
  <div class="keys" id="keys"></div>
</div>

<script src="vendor/vexflow.js"></script>
<script>
const { Renderer, Stave, StaveNote, StaveConnector, Voice, Formatter } = Vex.Flow;
const LETTERS = ['C','D','E','F','G','A','B'];

// Diatonic number n = octave*7 + letterIndex. Ranges include a few ledger-line notes.
const C4 = 4*7;
const CLEFS = {
  treble: { lo: C4 + 0,      hi: 5*7 + 5 },   // C4 .. A5
  bass:   { lo: 2*7 + 2,     hi: C4 + 0 },    // E2 .. C4
  grand:  { lo: 2*7 + 2,     hi: 5*7 + 5 },   // E2 .. A5 (C4 and up on treble, below on bass)
};

const VIEW_W = 142, STAVE_W = 140, STAVE_Y = 10;   // single staff
const GRAND = { x: 18, w: 122, trebleY: 0, bassY: 80, h: 215 };

let mode = 'treble', note = null, locked = false;
try { const m = localStorage.getItem('mode'); if (CLEFS[m]) mode = m; } catch (e) {}

const $ = id => document.getElementById(id);
const stage = $('stage'), score = $('score');
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// Which clef is the note drawn on?
const clefOf = n => mode === 'grand' ? (n >= C4 ? 'treble' : 'bass') : mode;
const keyFor = n => LETTERS[n % 7].toLowerCase() + '/' + Math.floor(n / 7);

function draw(color) {
  score.replaceChildren();
  const ink = cssVar('--ink');
  const grand = mode === 'grand';
  const h = grand ? GRAND.h : 120;

  const renderer = new Renderer(score, Renderer.Backends.SVG);
  renderer.resize(VIEW_W, h);
  const ctx = renderer.getContext();
  ctx.setFillStyle(ink); ctx.setStrokeStyle(ink);
  const style = { fillStyle: ink, strokeStyle: ink };

  let staves, target;
  if (grand) {
    const t = new Stave(GRAND.x, GRAND.trebleY, GRAND.w).addClef('treble');
    const b = new Stave(GRAND.x, GRAND.bassY, GRAND.w).addClef('bass');
    for (const s of [t, b]) { s.setStyle(style); s.setContext(ctx).draw(); }
    const types = StaveConnector.type;
    for (const type of [types.BRACE, types.SINGLE_LEFT, types.SINGLE_RIGHT]) {
      const c = new StaveConnector(t, b).setType(type);
      c.setStyle(style); c.setContext(ctx).draw();
    }
    target = clefOf(note) === 'treble' ? t : b;
  } else {
    target = new Stave(1, STAVE_Y, STAVE_W).addClef(mode);
    target.setStyle(style);
    target.setContext(ctx).draw();
  }

  const c = color || ink;
  const sn = new StaveNote({ keys: [keyFor(note)], duration: 'q', clef: clefOf(note), auto_stem: true });
  sn.setStyle({ fillStyle: c, strokeStyle: c });
  sn.setLedgerLineStyle({ fillStyle: c, strokeStyle: c, lineWidth: 1.5 });

  const voice = new Voice({ num_beats: 1, beat_value: 4 }).addTickables([sn]);
  new Formatter().joinVoices([voice]).format([voice], 0);
  const room = target.getNoteEndX() - target.getNoteStartX();
  sn.setXShift(room / 2 - 18);
  voice.draw(ctx, target);

  const svg = score.querySelector('svg');
  svg.setAttribute('viewBox', `0 0 ${VIEW_W} ${h}`);
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.style.width = '100%'; svg.style.height = 'auto';
}

function nextNote() {
  const c = CLEFS[mode];
  let n;
  do { n = c.lo + Math.floor(Math.random() * (c.hi - c.lo + 1)); } while (n === note);
  note = n;
  draw();
}

let flashTimer;
function flash(cls) {
  clearTimeout(flashTimer);
  stage.classList.remove('ok', 'bad');
  void stage.offsetWidth;
  stage.classList.add(cls);
  flashTimer = setTimeout(() => stage.classList.remove(cls), 350);
}

function answer(letter) {
  if (locked) return;
  if (LETTERS[note % 7] === letter) {
    locked = true; flash('ok'); draw(cssVar('--ok'));
    setTimeout(() => { nextNote(); locked = false; }, 300);
  } else {
    flash('bad'); draw(cssVar('--bad'));
    const shown = note;
    setTimeout(() => { if (note === shown && !locked) draw(); }, 350);
  }
}

function setMode(m) {
  mode = m;
  try { localStorage.setItem('mode', m); } catch (e) {}
  for (const k of Object.keys(CLEFS)) $('m-' + k).setAttribute('aria-pressed', k === m);
  note = null; locked = false; nextNote();
}

function setTheme(t, save) {
  document.documentElement.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? '☀︎' : '☾';
  document.querySelector('meta[name=theme-color]').setAttribute('content', cssVar('--bg'));
  if (save) try { localStorage.setItem('theme', t); } catch (e) {}
  if (note !== null) draw();
}

for (const l of ['A','B','C','D','E','F','G']) {
  const b = document.createElement('button');
  b.textContent = l;
  b.addEventListener('pointerdown', e => { e.preventDefault(); answer(l); });
  $('keys').append(b);
}
for (const k of Object.keys(CLEFS)) $('m-' + k).onclick = () => setMode(k);
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);

setTheme(document.documentElement.dataset.theme, false);
setMode(mode);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
